[project]
name = "qc-mcp"
version = "0.1.0"
description = "MCP server to read and control a Neural DSP Quad Cortex over its reverse-engineered USB-HID protocol"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
keywords = ["quad-cortex", "neural-dsp", "mcp", "guitar", "usb-hid", "reverse-engineering"]
dependencies = [
    "mcp>=1.2.0",
    "protobuf>=5.0",
]

[project.optional-dependencies]
# only needed for the reverse-engineering tools in tools/
re = ["capstone>=5.0", "pyusb>=1.2", "python-rtmidi>=1.5"]
# only needed for the GUI verification harness in tools/gui/ (screenshots/clicks)
gui = ["pyobjc>=10"]
# only needed for loudness metering + preset leveling (qc_mcp/loudness.py, audio_io.py).
# All ship as prebuilt wheels on macOS arm64 / CPython 3.14 — no compiler, and PortAudio
# is bundled inside the sounddevice wheel, so Homebrew is not needed either.
# matplotlib is NOT ours: mosqito imports it at module scope without declaring it, so
# omitting it makes `from mosqito.sq_metrics import loudness_zwtv` fail at runtime.
audio = [
    "numpy>=1.26",
    "scipy>=1.11",
    "sounddevice>=0.5",
    "soundfile>=0.12",
    "pyloudnorm>=0.1.1",
    "mosqito>=1.2",
    "matplotlib>=3.8",
]

[project.urls]
Homepage = "https://github.com/lexasoft123/qc-mcp"
"Protocol writeup" = "https://github.com/lexasoft123/qc-mcp/blob/main/PROTOCOL.md"

[project.scripts]
qc-mcp = "qc_mcp.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
qc_mcp = ["qc_descriptors.pb", "ModelRepo.xml"]
