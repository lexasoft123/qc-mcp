appId: com.lexasoft.patchbay
productName: Patchbay
directories:
  output: dist
files:
  - '!src/*'
  - '!scripts/*'
  # afterPack copies the arch-matching binary out of here; without this the
  # asar would swallow every target's uv (~85 MB) into every build.
  - '!resources/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!electron-builder.yml'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
  - '!{.gitignore,README.md,package-lock.json}'
  # TypeScript's incremental build state — 84 KB of local build paths that were
  # riding along inside the asar.
  - '!*.tsbuildinfo'
asar: true
npmRebuild: false

# Chromium ships 57 locale .pak files, ~40 MB unpacked, for an app whose own
# strings are English only. Both names are listed because the two platforms
# spell it differently: macOS keeps en.lproj, Windows locales/en-US.pak.
electronLanguages: [en, en-US]
compression: maximum
afterPack: scripts/afterPack.cjs
artifactName: ${productName}-${version}-${os}-${arch}.${ext}

# The qc-mcp payload. It is staged out of the bundle into userData on first run
# (stagedRepo() in src/main/paths.ts) because the venv and the instrumented
# build both have to write next to these sources — and inside a signed .app
# they cannot. Sources only: no .venv, no built dylib, no instrumented copy.
extraResources:
  - from: ../src
    to: qc-mcp/src
  - from: ../proto
    to: qc-mcp/proto
  - from: ../interceptor
    to: qc-mcp/interceptor
    filter: ['*.c', '*.sh']
  - from: ../pyproject.toml
    to: qc-mcp/pyproject.toml
  - from: ../README.md
    to: qc-mcp/README.md
  - from: ../LICENSE
    to: qc-mcp/LICENSE

mac:
  icon: build/icon.icns
  # No `identity` key. Setting it to null made sign() return before doing
  # anything — and notarizeIfProvided() is called from the END of sign(), so
  # `notarize` below would never have run either. Absent, electron-builder
  # auto-discovers a "Developer ID Application" identity from CI's
  # CSC_NAME/CSC_KEYCHAIN or the local keychain; when it finds none it logs
  # "skipped macOS application code signing" and returns false, leaving
  # afterPack.cjs's ad-hoc signature as the final one. That is what keeps a
  # fork, or any Mac without a Developer ID certificate, building exactly as
  # before. See docs/MACOS-SIGNING.md.
  #
  # hardenedRuntime/entitlements/entitlementsInherit/notarize are flat `mac:`
  # siblings, NOT nested under a `sign:` key. In the pinned v25, `mac.sign` is
  # the slot for a custom sign *function* (`CustomMacSign | string | null`);
  # the nested-object shape some docs show is a v27+ schema. A nested object
  # here would pass through resolveFunction() untouched and then be CALLED the
  # first time a real identity is found — i.e. exactly when this is meant to
  # start working — so it would look fine on every machine without a
  # certificate. Checked against the installed 25.1.8, not the online docs.
  #
  # hardenedRuntime is already the v25 default for non-mas mac builds
  # (`hardenedRuntime !== false`); stated explicitly because the entitlements
  # below only make sense with it, and a silent default is a bad thing to have
  # notarization depend on.
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.inherit.plist
  # Warns and skips (not fails) when no notarization credentials are in the
  # environment, so `npm run dist:mac` on a machine without them is unchanged.
  # It is only reached when signing actually happened. Reads APPLE_API_KEY /
  # APPLE_API_KEY_ID / APPLE_API_ISSUER — see docs/MACOS-SIGNING.md, and note
  # that a PARTIAL set of those three throws rather than skipping.
  notarize: true
  category: public.app-category.music
  darkModeSupport: true
  target:
    - target: dmg
      arch: [arm64, x64]
dmg:
  title: ${productName}
  # lzfse rather than the default zlib. ULMO (LZMA) compresses better still
  # but needs electron-builder 27; this project is on 25.
  format: ULFO

win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch: [x64]
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
