[project]
name = "qc-mcp"
version = "0.1.0"
description = "MCP server to read and control a Neural DSP Quad Cortex over its reverse-engineered USB-HID protocol"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
keywords = ["quad-cortex", "neural-dsp", "mcp", "guitar", "usb-hid", "reverse-engineering"]
classifiers = [
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: Microsoft :: Windows",
]
dependencies = [
    "mcp>=1.2",
    "protobuf>=5.0",
]

[project.optional-dependencies]
# only needed for the reverse-engineering tools in tools/
re = ["capstone>=5.0", "pyusb>=1.2", "python-rtmidi>=1.5"]
# only needed for the GUI verification harness in tools/gui/ (macOS-only:
# it drives Cortex Control via screencapture + the accessibility API)
gui = ["pyobjc>=10; sys_platform == 'darwin'"]

[project.urls]
Homepage = "https://github.com/lexasoft123/qc-mcp"
"Protocol writeup" = "https://github.com/lexasoft123/qc-mcp/blob/main/PROTOCOL.md"

[project.scripts]
qc-mcp = "qc_mcp.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
qc_mcp = ["descriptors/*.pb", "qc_descriptors.pb", "ModelRepo.xml"]
