name: Build & Release

# Tags publish; the weekly run is a smoke test. Packaging breaks in ways the
# Checks workflow cannot see — electron-builder never runs there, and neither
# does the uv download — so a release must not be the first time this path is
# exercised. Nothing is published outside a tag ref: the attach step is gated
# on one.
on:
  workflow_dispatch:
  push:
    tags: ['v*']
  schedule:
    - cron: '31 5 * * 2'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  dist:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Both mac arches from the one runner — electron-builder pulls the
          # x64 Electron itself and afterPack picks the matching uv — but ONE
          # ARCH PER INVOCATION. A single `--mac` run builds both DMGs in
          # parallel and each mounts /Volumes/Patchbay; they collide, and
          # `hdiutil detach -quiet /Volumes/Patchbay` then fails all five
          # retries. That is what broke the first release build here.
          - os: macos-latest
            name: macOS (dmg, arm64 + x64)
            package: |
              npx electron-builder --mac dmg:arm64 --publish never
              npx electron-builder --mac dmg:x64 --publish never
          - os: windows-latest
            name: Windows (nsis, x64)
            package: npx electron-builder --win --publish never
    runs-on: ${{ matrix.os }}
    # 45 was sized for packaging alone. The macOS leg now also waits on
    # Apple's notary service TWICE — the two arches are separate
    # electron-builder invocations, so each submits and staples its own
    # .app — and that queue is not under our control.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5

      # ── the Python package has to be green before anything is packaged ──
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install -e .
      - name: Offline suite
        shell: bash
        run: |
          fail=0
          for t in tests/test_*.py; do
            printf '%-34s ' "$t"
            if python "$t" > /tmp/out 2>&1; then tail -1 /tmp/out; else fail=1; echo FAIL; cat /tmp/out; fi
          done
          exit $fail

      # ── the app ──
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install
        working-directory: app
        run: npm ci

      # The tag is the single source of truth for the version, so a release
      # cannot ship artifacts named after a stale package.json.
      - name: Version from tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        working-directory: app
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          npm version --no-git-tag-version --allow-same-version "${TAG#v}"

      # Pinned version, pinned sha256 — see scripts/fetch-uv.mjs. Cached
      # because it is ~40 MB per target off GitHub releases on every run.
      - name: Cache uv
        uses: actions/cache@v6
        with:
          path: app/resources/uv
          key: uv-${{ runner.os }}-${{ hashFiles('app/scripts/fetch-uv.mjs') }}

      - name: Fetch uv
        working-directory: app
        run: npm run fetch:uv

      - name: Build
        working-directory: app
        run: npm run build

      # ── Developer ID signing + notarization (macOS leg only) ──
      # Everything here is tolerant of missing secrets on purpose. A fork gets
      # none of this repo's secrets, and a rotated/cleared secret leaves the
      # value empty; both must degrade to the ad-hoc signed dmg afterPack.cjs
      # already produces, not fail the leg. (A fresh clone is NOT one of these
      # — secrets live in the repository's GitHub settings, never in the
      # checkout.) Gated on runner.os so nothing lands in the Windows job's
      # env: electron-builder's CSC_* variables also drive the Windows
      # Authenticode path, and leaking Apple config across the matrix surfaces
      # as a Windows signing failure with nothing "Apple" in its message.
      - name: macOS signing + notarization secrets
        if: runner.os == 'macOS'
        run: |
          # `if/then`, NOT `[ -n "$2" ] && echo …`. GitHub runs this step as
          # `bash -e {0}`. The AND-list is exempt from errexit inside the
          # function body, but the FUNCTION then returns 1 for an empty value,
          # and the call site is a plain simple command — so errexit kills the
          # step. With no secrets set (the very case this tolerance exists for)
          # the `&&` form exits 1 immediately, taking the macOS leg down after
          # the tests pass and before anything is packaged.
          set_if_present() {
            if [ -n "$2" ]; then echo "$1=$2" >> "$GITHUB_ENV"; fi
          }

          # We import the certificate OURSELVES and hand electron-builder a
          # ready keychain rather than setting CSC_LINK and letting it import.
          # That is not a preference — CSC_LINK is BROKEN in the pinned
          # electron-builder 25.1.8. app-builder-lib's createKeychain builds
          # the temp keychain with `randomBytes(32).toString("base64")` as its
          # password, then importCerts runs
          #
          #   security set-key-partition-list -S apple-tool:,apple: -s \
          #     -k <THE .p12 PASSWORD> <keychain>
          #
          # where -k takes the KEYCHAIN password. The two agree only if you
          # happened to use the same string for both. It surfaces as a bare
          # "security process failed 1" with nothing pointing at a password
          # mix-up, and electron-builder echoes the failing command — .p12
          # password included — into the job log. Verified present in the
          # installed 25.1.8 (out/codeSign/macCodeSign.js), not assumed from
          # the version SingZ hit it on.
          #
          # CSC_KEYCHAIN is only consulted when CSC_LINK is unset —
          # macPackager.js calls createKeychain solely when getCscLink() is
          # non-null — so setting CSC_LINK at all is what re-enters the bug.
          if [ -n "$APPLE_DEVELOPER_ID_CERTIFICATE_BASE64" ]; then
            kc="$RUNNER_TEMP/patchbay-signing.keychain-db"
            # Ours, not the .p12's: this is what set-key-partition-list wants.
            kcpw=$(openssl rand -base64 24)
            # 600 before the bytes land, and removed on every path — the
            # private key should not outlive this block even if import fails
            # under errexit.
            ( umask 077; printf '%s' "$APPLE_DEVELOPER_ID_CERTIFICATE_BASE64" \
                | base64 -d > "$RUNNER_TEMP/cert.p12" )
            trap 'rm -f "$RUNNER_TEMP/cert.p12"' EXIT

            security create-keychain -p "$kcpw" "$kc"
            # Default settings re-lock after 300s idle; the Package step here
            # runs two full electron-builder invocations plus two
            # notarization waits, so a default-settings keychain would lock
            # mid-sign.
            security set-keychain-settings "$kc"
            security unlock-keychain -p "$kcpw" "$kc"
            security import "$RUNNER_TEMP/cert.p12" -k "$kc" \
              -T /usr/bin/codesign -T /usr/bin/productbuild \
              -P "$APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD"
            # Without this, codesign on a headless runner cannot reach the
            # private key and fails with errSecInternalComponent — there is no
            # one there to click "Allow".
            security set-key-partition-list -S apple-tool:,apple: -s -k "$kcpw" "$kc" >/dev/null
            # find-identity and codesign consult the user search list, not
            # only --keychain. Append rather than replace, so the runner's
            # login keychain stays reachable.
            security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
            rm -f "$RUNNER_TEMP/cert.p12"

            # Read the name off the cert rather than hardcoding a person's
            # name here — renewing the certificate should not mean editing
            # this workflow. ANCHORED on the type: a .p12 holding an Apple
            # Development or Apple Distribution certificate would otherwise
            # satisfy the guard, leave the prefix strip a no-op, and put a
            # non-Developer-ID name into CSC_NAME.
            name=$(security find-identity -v -p codesigning "$kc" \
              | sed -n 's/.*"\(Developer ID Application: .*\)".*/\1/p' | head -1)
            if [ -z "$name" ]; then
              echo "::error::Certificate imported but no Developer ID Application identity found —"\
                   "is APPLE_DEVELOPER_ID_CERTIFICATE_BASE64 a Developer ID Application .p12?"
              exit 1
            fi
            # CSC_NAME wants the identity BARE. app-builder-lib's checkPrefix()
            # throws outright on a leading "Developer ID Application: ", which
            # is exactly what find-identity prints — hence the strip.
            echo "CSC_KEYCHAIN=$kc" >> "$GITHUB_ENV"
            echo "CSC_NAME=${name#Developer ID Application: }" >> "$GITHUB_ENV"
          fi

          # APPLE_API_KEY is a FILESYSTEM PATH to the .p8, not the key's
          # contents. app-builder-lib passes it through untouched to
          # @electron/notarize, whose typings read "File system path to the
          # `.p8` private key" and which splices it into
          # `xcrun notarytool --key <value>`. Handing it base64 makes
          # notarytool look for a file named by a 250-character blob. (Some
          # electron-builder docs show a base64 body here; for the pinned
          # version, the code is what counts.) RUNNER_TEMP dies with the job.
          if [ -n "$APP_STORE_CONNECT_API_KEY_BASE64" ]; then
            printf '%s' "$APP_STORE_CONNECT_API_KEY_BASE64" | base64 -d > "$RUNNER_TEMP/AuthKey.p8"
            chmod 600 "$RUNNER_TEMP/AuthKey.p8"
            echo "APPLE_API_KEY=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"
          fi
          # All three or none: getNotarizeOptions() THROWS on a partial set
          # (`Env vars APPLE_API_KEY, APPLE_API_KEY_ID and APPLE_API_ISSUER
          # need to be set`) and only skips with a warning when all three are
          # absent. That is why each is written solely when non-empty.
          set_if_present APPLE_API_KEY_ID "$APP_STORE_CONNECT_API_KEY_ID"
          set_if_present APPLE_API_ISSUER "$APP_STORE_CONNECT_API_ISSUER_ID"

          if [ -n "$APPLE_DEVELOPER_ID_CERTIFICATE_BASE64" ]; then
            # The active paid membership's team — the same one the Developer
            # ID certificate above is issued under.
            echo "APPLE_TEAM_ID=USJ7H3X44X" >> "$GITHUB_ENV"
          else
            echo "::warning::No APPLE_DEVELOPER_ID_CERTIFICATE_BASE64 — this dmg ships"\
                 "ad-hoc signed only (afterPack.cjs's fallback), same as before this was wired up."
          fi
        env:
          APPLE_DEVELOPER_ID_CERTIFICATE_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_CERTIFICATE_BASE64 }}
          APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD }}
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}

      - name: Package
        working-directory: app
        shell: bash
        run: ${{ matrix.package }}

      # Every run keeps its artifacts, tag or not — that is what makes the
      # weekly run a usable smoke test rather than just a green tick.
      - name: Upload artifacts
        uses: actions/upload-artifact@v5
        with:
          name: patchbay-${{ runner.os }}
          path: |
            app/dist/*.dmg
            app/dist/*.exe
          if-no-files-found: error

      # gh, not a release action: the two matrix jobs race to create the
      # release and gh handles that collision without dropping a platform's
      # assets. --clobber makes a re-run of one job idempotent.
      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          # A hyphenated tag (v0.2.0-rc1) is a prerelease: never "latest", so
          # only someone handed the link installs one.
          PRE=(); case "$TAG" in *-*) PRE=(--prerelease);; esac
          NOTES="docs/release-notes/$TAG.md"
          if [ -f "$NOTES" ]; then
            tail -n +2 "$NOTES" > /tmp/relnotes-body.md
            gh release create "$TAG" "${PRE[@]}" --title "$(head -n 1 "$NOTES")" --notes-file /tmp/relnotes-body.md 2>/dev/null || true
          else
            gh release create "$TAG" "${PRE[@]}" --title "$TAG" --notes "" 2>/dev/null || true
          fi
          # nullglob: each job only has its own platform's files
          shopt -s nullglob
          FILES=(app/dist/*.dmg app/dist/*.exe app/dist/*.blockmap)

          # latest.yml is the feed the in-app updater reads on Windows, written
          # by the nsis target because electron-builder.yml carries a `publish`
          # block (electron-builder still publishes nothing itself).
          #
          # The macOS leg writes a latest-mac.yml as well — dmg-builder's
          # DmgTarget sets `isWriteUpdateInfo` from the blockmap it builds, so a
          # dmg-only build does produce one — and it is deliberately NOT
          # uploaded: the two mac arches are separate electron-builder
          # invocations writing the same filename, so it only ever describes
          # whichever ran last (x64). Publishing it would leave correct-looking
          # update metadata that offers an Apple Silicon user the Intel build
          # the day someone wires macOS up to electron-updater. Nothing reads it
          # today — macOS asks the releases API, see src/main/updater.ts.
          #
          # Named in an `if`, not added to the glob list. `shopt -s nullglob`
          # drops a PATTERN that matches nothing; a literal path is not a
          # pattern, so it survives into the array and `gh release upload` then
          # fails on a file the macOS runner never had. That is exactly how the
          # first v0.1.3 build lost its mac leg. And `if/then` rather than
          # `[ -f … ] && FILES+=(…)`, because this step runs under `bash -e` and
          # a trailing AND-list that tests false fails the step — the same trap
          # the signing step above documents.
          if [ -f app/dist/latest.yml ]; then
            FILES+=(app/dist/latest.yml)
          fi

          gh release upload "$TAG" "${FILES[@]}" --clobber
